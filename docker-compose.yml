services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: aivideo-app
    working_dir: /var/www/html
    command: >-
      sh -lc "mkdir -p storage/framework/cache storage/framework/sessions
      storage/framework/views bootstrap/cache
      && chown -R www-data:www-data storage bootstrap/cache
      && chmod -R 775 storage bootstrap/cache
      && if [ ! -f vendor/autoload.php ]; then composer install; fi
      && php-fpm -F"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    env_file:
      - .env.docker
    environment:
      DB_SOCKET: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: aivideo-queue
    working_dir: /var/www/html
    command: >-
      sh -lc "if [ ! -f vendor/autoload.php ]; then composer install; fi
      && php artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    env_file:
      - .env.docker
    environment:
      DB_SOCKET: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: aivideo-web
    ports:
      - "8010:80"
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  vite:
    image: node:20-alpine
    container_name: aivideo-vite
    working_dir: /var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: aivideo-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: aivideo
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: aivideo
      MYSQL_PASSWORD: aivideo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      timeout: 5s
      retries: 20
      interval: 5s

  redis:
    image: redis:7-alpine
    container_name: aivideo-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 20
      interval: 5s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aivideo-phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: aivideo
      PMA_PASSWORD: aivideo
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  node_modules_data:
  storage_data:
  vendor_data:
