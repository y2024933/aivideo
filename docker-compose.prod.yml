services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cms-app
    working_dir: /var/www/html
    restart: unless-stopped
    command: >-
      sh -lc "mkdir -p storage/framework/cache storage/framework/sessions
      storage/framework/views bootstrap/cache storage/app/public storage/app/livewire-tmp
      && chown -R www-data:www-data storage bootstrap/cache
      && chmod -R 775 storage bootstrap/cache
      && if [ ! -f vendor/autoload.php ]; then composer install --no-dev --optimize-autoloader; fi
      && php artisan migrate --force
      && php artisan storage:link 2>/dev/null || true
      && php artisan config:cache
      && php artisan route:cache
      && php artisan view:cache
      && php-fpm -F"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - storage_data:/var/www/html/storage
    env_file:
      - .env.production
    environment:
      DB_SOCKET: ""
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: cms-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:20-alpine
    container_name: cms-node
    working_dir: /var/www/html
    command: sh -lc "npm ci && npm run build"
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
      - vendor_data:/var/www/html/vendor
    env_file:
      - .env.production
    profiles:
      - build

  mysql:
    image: mysql:8.4
    container_name: cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-multisite_cms}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-multisite}
      MYSQL_PASSWORD: ${DB_PASSWORD:-multisite}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      timeout: 5s
      retries: 20
      interval: 5s

volumes:
  mysql_data:
  node_modules_data:
  storage_data:
  vendor_data:
